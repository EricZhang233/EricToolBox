# EricSoftInstaller 安装配置
# 直接编辑此文件后打包。必填项填入实际值；可选项为空或格式无效时采用默认行为。
# YAML 用两个空格缩进。布尔值使用 true / false，整数不加引号，列表使用 [值1, 值2]。
# 含 #、冒号加空格或前导空格的字符串请用引号；多行文本可用 |-。

# ── 安装必填 ───────────────────────────────────────────────────
productName: '' # 应用显示名称。字符串，例如 '我的应用'。
productId: '' # 稳定且唯一的产品标识。建议使用 Vendor.App 格式，不含空格，最长 128 字符。
mainExecutable: '' # 载荷根目录中的主程序文件名。填带 .exe 的文件名，不带目录。

# ── 安装信息与路径 ─────────────────────────────────────────────
version: '' # 可选的显示版本。接受 1.2.3 或 1.2.3.4，每段是 0–65535。
publisher: '' # 发布者显示名称。留空时隐藏。
architecture: x64 # 目标架构。接受 x64、arm64 或 x86。
icon: '' # 可选的 ICO 文件，路径相对于本配置，例如 'assets/app.ico'。
installDirectoryName: '' # 默认补上的应用目录名，默认取产品 ID。
defaultInstallSubdirectory: '\AppData\' # \AppData\ 按当前用户安装，\ProgramFiles\ 按整机安装。可指定完整子路径，例如 '\ProgramFiles\Vendor\MyApp'。
dataSubdirectory: '' # 相对于 %ProgramData% 的共享数据路径，默认取产品 ID。两种安装范围都适用；卸载时可选择保留或删除。
tempSubdirectory: '' # 相对于系统临时目录的工作和日志路径，默认为 EricSoftInstaller/<产品 ID>。
uninstallerName: Uninstall.exe # 安装目录里的卸载器文件名，须以 .exe 结尾。
defaultKeepData: true # 卸载时默认保留数据。

# ── 快捷方式与关停 ─────────────────────────────────────────────
shortcutName: '' # 桌面与开始菜单快捷方式名称。不带 .lnk，默认取应用名。
appUserModelId: '' # Windows Shell 应用标识。无空格、最多 128 字符，默认取产品 ID。
startupValueName: '' # 对应安装范围的 Run 启动项名称。卸载时会匹配该名称及 EXE 路径，默认取产品 ID。
defaultDesktopShortcut: false # 新安装时默认创建桌面快捷方式。
defaultStartMenuShortcut: true # 新安装时默认创建开始菜单快捷方式。
companionExecutables: [] # 须等待退出的同目录辅助程序。EXE 文件名列表，例 ['MyApp.Cli.exe']。
shutdownPipeName: '' # 主程序的关停命名管道名。仅填名称，不带 \\.\pipe\ 前缀。
shutdownPipeCommand: 'EXIT' # 写入上述关停管道的 UTF-8 命令字符串。

# ── 载荷 ────────────────────────────────────────────────────────
protectedPaths: [] # 安装目录根部保留的数据项。文件或目录名列表，例 ['Data', 'Cache']。不能使用安装器保留名称。
requiredPayloadFiles: [] # 打包时检查的额外必需文件。相对路径列表，例 ['resources/app.dat']。
excludedPayloadPatterns: ['*.pdb', '*.log', '*.bak'] # 载荷中拒绝出现的文件模式。通配符列表。

# ── 安装模式与升级 ─────────────────────────────────────────────
allowExtract: true # 允许图形界面和 --extract 仅解压应用文件。
restartAfterInstall: false # 静默安装或升级成功后启动主程序。

# ── 中英文文案 ─────────────────────────────────────────────────
